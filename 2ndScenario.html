<!DOCTYPE html>
<html>
<head>
<title>Responsive Navbar</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

header {
    background: #101b30;
    color: white;
    padding: 15px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

button {
    display: none;
    background: none;
    color: white;
    border: none;
    font-size: 25px;
    cursor: pointer;
}

nav ul {
    display: flex;
    list-style: none;
}

nav a {
    color: white;
    text-decoration: none;
    padding: 15px;
}

nav a:hover {
    background: blue;
}

main {
    padding: 30px;
}

@media(max-width:600px) {
    button {
        display: block;
    }

    nav ul {
        display: none;
        flex-direction: column;
        width: 100%;
    }

    nav.open ul {
        display: flex;
    }

    nav a {
        display: block;
        padding: 15px;
    }

    header {
        flex-wrap: wrap;
    }

    nav {
        width: 100%;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">MyShop</div>

    <button onclick="menu()">&#9776;</button>

    <nav id="nav">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
</header>

<main>
    <h2>Welcome to MyShop</h2>
    <p>Resize the browser window to see the menu change.</p>
</main>

<script>
function menu() {
    document.getElementById("nav").classList.toggle("open");
}
</script>

</body>
</html>
